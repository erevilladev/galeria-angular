<div 
  class="modal-backdrop" 
  (click)="onBackdropClick($event)" 
  role="dialog" 
  aria-modal="true" 
  [attr.aria-label]="image.title"
>
  <div class="modal-dialog">
    <button type="button" class="close-btn" (click)="onClose()" aria-label="Cerrar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <button 
      type="button" 
      class="nav-btn prev-btn" 
      (click)="onPrevious()" 
      aria-label="Imagen anterior"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="modal-card">
      <div class="modal-figure">
        <img 
          [src]="image.url" 
          [alt]="image.title" 
          (error)="onImageError($event)"
          class="modal-image"
        />
      </div>

      <div class="modal-body">
        <div class="modal-header">
          <div>
            <span class="category">{{ image.category }}</span>
            <h2 class="title">{{ image.title }}</h2>
          </div>

          <button 
            type="button"
            class="like-btn" 
            [class.active]="image.liked" 
            (click)="onToggleLike()"
            [attr.aria-label]="image.liked ? 'Quitar me gusta' : 'Dar me gusta'"
          >
            <svg viewBox="0 0 24 24" class="heart-icon" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span>{{ image.likes }}</span>
          </button>
        </div>

        <p class="description">{{ image.description }}</p>

        <div class="tags">
          @for (tag of image.tags; track tag) {
            <span class="tag">#{{ tag }}</span>
          }
        </div>

        <dl class="meta-list">
          <div class="meta-row">
            <dt>Fotógrafo</dt>
            <dd>{{ image.author }}</dd>
          </div>
          <div class="meta-row">
            <dt>Fecha</dt>
            <dd>{{ image.date }}</dd>
          </div>
        </dl>

        <div class="modal-footer">
          <a [href]="image.url" target="_blank" rel="noopener noreferrer" class="link-external">
            Abrir imagen original
          </a>
        </div>
      </div>
    </div>

    <button 
      type="button" 
      class="nav-btn next-btn" 
      (click)="onNext()" 
      aria-label="Siguiente imagen"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>
</div>
