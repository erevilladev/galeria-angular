<div class="card" (click)="onCardClick()" tabindex="0" role="button" (keydown.enter)="onCardClick()" (keydown.space)="onCardClick()" [attr.aria-label]="'Ver imagen ampliada: ' + image.title">
  <div class="image-wrapper">
    <img 
      [src]="image.thumbnailUrl" 
      [alt]="image.title" 
      loading="lazy" 
      (error)="onImageError($event)"
      class="card-image"
    />
    <span class="category-badge">{{ image.category }}</span>
    <div class="overlay">
      <span class="zoom-hint">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
        Ampliar
      </span>
    </div>
  </div>

  <div class="card-body">
    <div class="card-header-row">
      <h3 class="card-title" [title]="image.title">{{ image.title }}</h3>
      <button 
        type="button"
        class="like-btn" 
        [class.liked]="image.liked" 
        (click)="onLikeClick($event)"
        [attr.aria-label]="image.liked ? 'Quitar me gusta' : 'Dar me gusta'"
      >
        <svg class="heart-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span class="like-count">{{ image.likes }}</span>
      </button>
    </div>

    <p class="card-description">{{ image.description }}</p>

    <div class="tags-container">
      @for (tag of image.tags; track tag) {
        <span class="tag">#{{ tag }}</span>
      }
    </div>

    <div class="card-footer">
      <span class="author">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        {{ image.author }}
      </span>
      <span class="date">{{ image.date }}</span>
    </div>
  </div>
</div>
