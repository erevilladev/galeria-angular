<article class="card" (click)="onCardClick()" tabindex="0" role="button" (keydown.enter)="onCardClick()" (keydown.space)="onCardClick()" [attr.aria-label]="'Abrir ' + image.title">
  <div class="media-container">
    @if (!imageError()) {
      <img 
        [src]="image.thumbnailUrl" 
        [alt]="image.title" 
        loading="lazy" 
        (error)="onImageError()"
        class="media-image"
      />
    } @else {
      <div class="media-fallback">
        <span>Imagen no disponible</span>
      </div>
    }
    <span class="media-tag">{{ image.category }}</span>
  </div>

  <div class="card-content">
    <div class="card-header">
      <h3 class="card-title">{{ image.title }}</h3>
      <button 
        type="button"
        class="like-btn" 
        [class.active]="image.liked" 
        (click)="onLikeClick($event)"
        [attr.aria-label]="image.liked ? 'Quitar me gusta' : 'Dar me gusta'"
      >
        <svg viewBox="0 0 24 24" class="heart-icon" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span class="like-count">{{ image.likes }}</span>
      </button>
    </div>

    <p class="card-description">{{ image.description }}</p>

    <div class="card-meta">
      <span class="author">{{ image.author }}</span>
      <span class="separator">/</span>
      <span class="date">{{ image.date }}</span>
    </div>
  </div>
</article>
